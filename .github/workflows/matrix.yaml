name: matrix
on: push

jobs:
  get-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [12, 14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: check matrix
        run: |
          echo "running on ${{ matrix.os }}"
          echo "running on ${{ matrix.version }}"
